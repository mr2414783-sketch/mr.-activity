<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr. Activity</title>
<meta name="theme-color" content="#7b3fe4">
<meta name="description" content="Kalender jadwal gym dan aktivitas, laporan dan target berat badan. Data hanya di perangkatmu.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mr. Activity">
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --soft:#f6f6f8; --line:#e6e6ea; --text:#17171c; --muted:#6b6b76;
  --good:#3f8f3f; --bad:#d64545; --info:#eef4ff; --warn:#fdf2e4;
  --accent:#7b3fe4; --accent2:#ff7a45; --accent-soft:#f1eaff;
}
:root[data-theme="dark"]{
  --bg:#101014; --card:#17171d; --soft:#1e1e26; --line:#2b2b35; --text:#f1f1f5; --muted:#9a9aa8;
  --good:#6fcf6f; --bad:#ff7070; --info:#1a2336; --warn:#33291a; --accent:#a27bf5; --accent-soft:#261c40;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 0 12px}
.head{display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:22px;line-height:1.1;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand h1 img{width:30px;height:30px;border-radius:9px;flex:none}
.brand h1 span{background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px;font-weight:600}
.pill{border:1px solid var(--line);background:var(--card);border-radius:16px;height:44px;min-width:44px;padding:0 13px;flex:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:19px;font-weight:800}
.pill.txt{font-size:14px}

.month{display:flex;align-items:center;justify-content:space-between;margin:16px 0}
.month b{font-size:21px;font-weight:800}
.round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}

.card{border:1px solid var(--line);border-radius:26px;padding:16px;background:var(--card);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--soft);border-radius:18px;padding:12px 14px;min-width:0}
.stat small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.stat b{display:block;font-size:23px;margin-top:2px;font-weight:800;white-space:nowrap}
.good{color:var(--good)} .bad{color:var(--bad)} .accent{color:var(--accent)}
.note{border-radius:18px;padding:13px 16px;font-size:15px;line-height:1.55;margin-top:10px;font-weight:600}
.note.info{background:var(--info)} .note.warn{background:var(--warn)}
h2{font-size:20px;margin:2px 0 6px;font-weight:800}
.sub{color:var(--muted);font-weight:700;font-size:13px;margin-bottom:6px}
.hint{color:var(--muted);font-size:13px;font-weight:600;line-height:1.5}

/* kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:2px 0 4px}
.day{border:1.5px solid transparent;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;
  padding:5px 0 5px;cursor:pointer;font-weight:700;font-size:14px;min-width:0;min-height:58px;color:var(--text)}
.day.out{background:transparent;cursor:default}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.day .n{width:25px;height:25px;display:grid;place-items:center;border-radius:50%}
.day.today .n{background:var(--accent);color:#fff}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:4px;padding:0 3px;max-width:100%}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dot.plan{background:transparent;border:1.5px solid var(--c)}
.dot.rt{background:transparent;border:1.5px dashed var(--c);opacity:.8}
.more{font-size:9px;color:var(--muted);line-height:7px}
.day.w::after{content:"";width:13px;height:3px;border-radius:2px;background:var(--good);margin-top:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;color:var(--muted);font-size:12px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%}

/* daftar */
.item{display:grid;grid-template-columns:44px 1fr auto;column-gap:12px;row-gap:8px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .actions{grid-column:2 / 4;justify-content:flex-end}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--soft)}
.meta{min-width:0}
.meta b{display:block;font-size:17px;font-weight:800;overflow-wrap:anywhere}
.meta small{color:var(--muted);font-weight:700}
.detail{grid-column:2 / 4;white-space:pre-line;color:var(--muted);font-size:14px;font-weight:600;line-height:1.5;background:var(--soft);border-radius:12px;padding:8px 12px}
.val{font-weight:800;color:var(--accent);text-align:right;font-size:15px;white-space:nowrap}
.val small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.badge.plan{background:var(--warn);color:#b36a00} .badge.done{background:#e5f5e5;color:#2d7a2d} .badge.rt{background:var(--info);color:#2f5fb3}
:root[data-theme="dark"] .badge.done{background:#1d3320;color:#7bdc7b}
:root[data-theme="dark"] .badge.plan{color:#f0b35a}
:root[data-theme="dark"] .badge.rt{color:#8fb4ff}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px}
.btn.primary{background:linear-gradient(90deg,var(--accent2),var(--accent));color:#fff;border:0;width:100%;padding:15px;font-size:16px;border-radius:18px}
.btn.sm{padding:8px 12px;border-radius:12px}
.btn.ok{background:var(--accent);color:#fff;border-color:var(--accent)}
.actions{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:20px 8px;font-weight:600;line-height:1.6}
.empty big{font-size:38px;display:block;margin-bottom:6px}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

/* jadwal mingguan */
.wk{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.wk:last-child{border-bottom:0}
.wk b{font-size:15px;padding-top:7px}
.wk.td b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rc{border:1.5px solid var(--c);color:var(--text);background:var(--card);border-radius:99px;padding:6px 8px 6px 11px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.rc u{text-decoration:none;color:var(--muted);font-size:15px;line-height:1}
.rc.add{border-style:dashed;border-color:var(--line);color:var(--muted);padding:6px 12px}

/* form */
label{display:block;font-weight:800;font-size:14px;margin:14px 0 6px}
.field{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:13px 14px;font-size:16px;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 15px;font-weight:700;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.act.on{background:var(--c);border-color:var(--c)}

/* progres & grafik */
.prog{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px}
.rowb{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.rowb small{color:var(--muted);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;margin:12px 0 4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bar i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--accent2),var(--accent));min-height:4px}
.bar span{font-size:12px;color:var(--muted);font-weight:700}
.bar em{font-style:normal;font-size:12px;font-weight:800}
.catbox{display:grid;gap:6px;margin-top:4px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--soft);font-weight:700;font-size:14px;border:1.5px solid transparent}
.crow small{color:var(--muted);font-weight:700;font-size:12px}
.crow.on{background:var(--accent-soft);border-color:var(--accent)}
svg.chart{width:100%;height:auto;display:block}
.g-line{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.g-area{fill:var(--accent);opacity:.13}
.g-grid{stroke:var(--line);stroke-width:1}
.g-txt{fill:var(--muted);font-size:10px;font-weight:700}
.g-tgt{stroke:var(--good);stroke-width:1.5;stroke-dasharray:5 4}
.g-tgt-t{fill:var(--good);font-size:10px;font-weight:800}
.g-pt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.g-last{fill:var(--accent)}
.g-val{fill:var(--text);font-size:11px;font-weight:800}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:none;padding:9px 0 8px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px}
nav button .e{display:block;font-size:25px;filter:grayscale(.9);opacity:.7;margin-bottom:2px}
nav button.on{color:var(--accent)} nav button.on .e{filter:none;opacity:1}

#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#222;color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet .btns{display:flex;gap:10px;margin-top:18px}
.sheet .btns .btn{flex:1;padding:13px}
.danger{background:var(--bad);color:#fff;border:0}
.inst{display:flex;align-items:center;gap:12px;margin:16px 0 0;padding:12px 14px;border-radius:20px;background:var(--accent-soft);border-color:var(--accent)}
.inst .t{flex:1;min-width:0;font-weight:800;font-size:15px;line-height:1.3}
.inst .t small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-top:2px}
.inst .btn{flex:none;background:var(--accent);color:#fff;border:0;padding:11px 16px}
.hide{display:none!important}

/* agenda harian */
.pill.on{border-color:var(--accent);background:var(--accent-soft)}
.ag-chk{cursor:pointer;border:1.5px solid var(--line);font-size:20px;padding:0;color:var(--muted)}
.ag-chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ag-done .meta b{text-decoration:line-through;color:var(--muted)}
.ag-add{display:grid;gap:10px;margin-top:6px}
.ag-add .field{padding:11px 13px}
.ag-day{display:flex;align-items:center;justify-content:space-between;margin:14px 0 12px;gap:8px}
.ag-day div{text-align:center;flex:1;min-width:0}
.ag-day b{display:block;font-size:18px;font-weight:800}
.ag-day small{color:var(--muted);font-weight:700;font-size:12px}
@media (max-width:380px){.brand small{display:none}.brand h1{font-size:19px}.pill.txt{padding:0 10px}}

/* ===== Tampilan baru: tombol & navigasi ===== */
:root{--sh:0 6px 18px -8px rgba(60,30,120,.35);--sh2:0 10px 24px -10px rgba(123,63,228,.7)}
:root[data-theme="dark"]{--sh:0 6px 18px -8px rgba(0,0,0,.8);--sh2:0 10px 24px -10px rgba(162,123,245,.55)}
button{transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
button:active{transform:scale(.95)}
.card{border-radius:28px;box-shadow:var(--sh);border-color:transparent}
.btn{border-radius:999px;border:0;background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;padding:11px 18px}
.btn:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.sm{padding:8px 14px;border-radius:999px;font-size:13px}
.btn.primary{border-radius:999px;box-shadow:var(--sh2);padding:16px;letter-spacing:.2px}
.btn.ok{border-radius:999px;background:linear-gradient(90deg,var(--accent2),var(--accent));border:0;box-shadow:var(--sh2)}
.danger{border-radius:999px;box-shadow:0 8px 20px -10px var(--bad)}
.pill{border-radius:50%;width:44px;padding:0;border:0;background:var(--accent-soft);box-shadow:var(--sh)}
.pill.txt{border-radius:999px;width:auto;padding:0 16px;background:linear-gradient(90deg,var(--accent2),var(--accent));color:#fff;box-shadow:var(--sh2)}
.pill.on{background:var(--accent);box-shadow:var(--sh2)}
.round{border:0;background:var(--accent-soft);color:var(--accent);font-weight:800;box-shadow:var(--sh)}
.chip{border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--soft);font-weight:800;padding:9px 16px}
.chip.on{background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:var(--sh2);color:#fff}
.chip.act.on{background:var(--c);box-shadow:0 8px 18px -8px var(--c)}
.rc{box-shadow:var(--sh)}
.ico{border-radius:16px}
nav{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 24px);max-width:536px;bottom:calc(10px + env(safe-area-inset-bottom));
  border:0;border-radius:30px;box-shadow:0 12px 34px -10px rgba(40,20,90,.45);padding:6px 6px;background:var(--card);padding-bottom:6px}
nav .in{max-width:none;gap:4px}
nav button{border-radius:24px;padding:8px 0 7px;font-weight:800}
nav button.on{background:var(--accent-soft)}
nav button .e{font-size:23px}
body{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
#toast{bottom:calc(112px + env(safe-area-inset-bottom))}
.sheet{border-radius:32px 32px 0 0}
/* agenda: kalender & jenis kegiatan */
.ag-cal .day{min-height:46px;border-radius:16px}
.ag-calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ag-calh b{font-size:17px;font-weight:800;flex:1;text-align:center}
.ag-calh .round{width:38px;height:38px;font-size:17px}
.ag-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.ag-scroll::-webkit-scrollbar{display:none}
.ag-scroll .chip{white-space:nowrap;flex:none;padding:8px 14px;font-size:13px}
.ag-lbl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:2px 0 -4px}
.ag-sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.ag-sum .stat{padding:10px 8px;text-align:center}
.ag-sum .stat b{font-size:17px}
.ag-tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;margin-left:6px;vertical-align:middle}
.ag-meta{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-top:3px;line-height:1.5}
</style>
</head>
<body>

<header>
  <div class="wrap head">
    <div class="brand">
      <h1><img src="icon-192.png" alt=""><span>Mr. Activity</span></h1>
      <small>Data hanya di perangkatmu</small>
    </div>
    <button class="pill" id="agBtn" aria-label="Agenda harian">📝</button>
    <button class="pill txt" id="todayBtn">Hari ini</button>
    <button class="pill" id="themeBtn" aria-label="Ganti tema">🌙</button>
  </div>
</header>

<div class="wrap"><div class="card inst hide" id="installBar">
  <div class="t">📲 Pasang di HP<small>Buka seperti aplikasi, bisa tanpa internet</small></div>
  <button class="btn" id="installBtn">⬇️ Pasang</button>
</div></div>

<main class="wrap" id="view"></main>

<nav><div class="in" id="nav">
  <button data-t="cal" class="on"><span class="e">📅</span>Kalender</button>
  <button data-t="add"><span class="e">➕</span>Catat</button>
  <button data-t="bb"><span class="e">⚖️</span>Berat</button>
  <button data-t="report"><span class="e">📊</span>Laporan</button>
</div></nav>

<div id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
/* ================= Konfigurasi aktivitas ================= */
const ACTS = {
  gym:   {name:"Gym",   emoji:"🏋️", c:"#7b3fe4", free:true, ph:"mis. Push, Chest Day, Upper Body", types:["Push","Pull","Legs","Full Body","Cardio","Core"],
          metric:{label:"Total beban", unit:"kg", ph:"mis. 4500", step:"1"},
          extra:{label:"Jumlah set", ph:"mis. 18"},
          detail:{label:"Daftar gerakan", ph:"Bench press 4x10 60kg\nIncline DB press 3x12 22kg"}},
  lari:  {name:"Lari",  emoji:"🏃", c:"#e8590c", types:["Easy Run","Interval","Tempo","Long Run","Recovery"],
          metric:{label:"Jarak", unit:"km", ph:"mis. 5.2", step:"0.01"},
          extra:{label:"Pace (menit/km)", ph:"mis. 6:10"},
          detail:{label:"Rute / catatan", ph:"Rute GBK 2 putaran"}},
  yoga:  {name:"Yoga",  emoji:"🧘", c:"#12a594", types:["Vinyasa","Hatha","Yin","Power","Meditasi"],
          metric:{label:"Jumlah pose", unit:"pose", ph:"mis. 20", step:"1"},
          extra:{label:"Level napas (1-5)", ph:"mis. 3"},
          detail:{label:"Daftar pose", ph:"Sun salutation x5\nWarrior II"}},
  renang:{name:"Renang",emoji:"🏊", c:"#1c7ed6", types:["Gaya Bebas","Gaya Dada","Gaya Punggung","Kupu-kupu","Campuran"],
          metric:{label:"Jumlah lap", unit:"lap", ph:"mis. 24", step:"1"},
          extra:{label:"Panjang kolam (m)", ph:"mis. 25"},
          detail:{label:"Set latihan", ph:"Pemanasan 4 lap\n6 x 2 lap interval"}},
  futsal:{name:"Futsal",emoji:"⚽", c:"#2f9e44", types:["Main Bareng","Latihan","Pertandingan","Turnamen"],
          metric:{label:"Gol / assist", unit:"poin", ph:"mis. 3", step:"1"},
          extra:{label:"Lokasi", ph:"mis. GOR Satria"},
          detail:{label:"Catatan main", ph:"Main 2 babak, lawan tim kantor"}},
};
const DAYS = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const DAYSF = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const MON_S = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const WD_ORDER = [1,2,3,4,5,6,0];

/* ================= State ================= */
const KEY = "mr-activity-v2";
function norm(d){
  return {records:d.records||[], routine:d.routine||{}, weights:d.weights||[],
    goals:Object.assign({week:4, minutes:600, targetKg:"", startKg:"", height:"", sex:""}, d.goals||{}),
    agenda:Array.isArray(d.agenda)?d.agenda:[], theme:d.theme||null, tab:"cal"};
}
function load(){
  try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d && Array.isArray(d.records)) return norm(d); }catch(e){}
  try{ const o=JSON.parse(localStorage.getItem("mr-activity-v1"));
    if(o && Array.isArray(o.records)) return norm({records:o.records.map(r=>({...r,time:"",detail:r.note||""})), theme:o.theme}); }catch(e){}
  return norm({});
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Penyimpanan penuh atau diblokir"); } }

const pad = n=>String(n).padStart(2,"0");
const iso = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s=>new Date(s+"T00:00:00");
const todayIso = ()=>iso(new Date());
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n=>Number(n).toLocaleString("id-ID",{maximumFractionDigits:2});
const fmt1 = n=>Number(n).toLocaleString("id-ID",{maximumFractionDigits:1});
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $ = s=>document.querySelector(s);

let cur = {y:new Date().getFullYear(), m:new Date().getMonth()};
let sel = todayIso();
let draft = null;
let rdraft = null;
let wRange = 30;
let wDate = todayIso();

function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function recsOn(d){ return S.records.filter(r=>r.date===d).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")||a.id.localeCompare(b.id)); }
function routineOn(d){
  if(d<todayIso()) return [];
  const wd=parse(d).getDay();
  return (S.routine[wd]||[]).filter(x=>!S.records.some(r=>r.date===d&&r.act===x.act&&r.type===x.type))
    .sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
}
function weightOn(d){ return S.weights.find(w=>w.date===d); }
function weightsAsc(){ return [...S.weights].sort((a,b)=>a.date.localeCompare(b.date)); }

/* ================= Tema ================= */
function applyTheme(){
  const dark = S.theme ? S.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#themeBtn").textContent = dark ? "☀️" : "🌙";
  document.querySelector('meta[name="theme-color"]').content = dark ? "#101014" : "#7b3fe4";
}

/* ================= Render ================= */
function render(keepScroll){
  applyTheme();
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.t===S.tab));
  const y = window.scrollY;
  $("#view").innerHTML = ({cal:viewCal, add:viewAdd, bb:viewBB, report:viewReport, agenda:viewAgenda})[S.tab]();
  { const ag=S.tab==="agenda", b=$("#agBtn"); b.classList.toggle("on", ag); b.textContent=ag?"🏋️":"📝"; b.setAttribute("aria-label", ag?"Catat olahraga":"Agenda harian"); }
  if(S.tab==="add") bindAdd();
  if(S.tab==="bb") bindBB();
  if(S.tab==="report") bindReport();
  if(S.tab==="agenda") bindAgenda();
  window.scrollTo(0, keepScroll ? y : 0);
}
function monthNav(){
  return `<div class="month"><button class="round" data-nav="-1" aria-label="Bulan lalu">‹</button>
    <b>${MONTHS[cur.m]} ${cur.y}</b><button class="round" data-nav="1" aria-label="Bulan depan">›</button></div>`;
}
const monthKey = ()=>`${cur.y}-${pad(cur.m+1)}`;

/* ---------- Kalender ---------- */
function viewCal(){
  const mk = monthKey(), mr = S.records.filter(r=>r.date.startsWith(mk));
  const done = mr.filter(r=>r.status==="done").length, plan = mr.filter(r=>r.status==="plan").length;
  const t = todayIso();

  const ws = weekStart(new Date()), we = new Date(ws); we.setDate(we.getDate()+7);
  const wkDone = S.records.filter(r=>r.status==="done" && parse(r.date)>=ws && parse(r.date)<we).length;
  const gw = +S.goals.week||1, pct = Math.min(100, Math.round(wkDone/gw*100));
  const info = wkDone>=gw ? `Target minggu ini tercapai: ${wkDone} dari ${gw} sesi. Mantap, pertahankan!`
    : `Minggu ini ${wkDone} dari ${gw} sesi (${pct}%). Sisa ${gw-wkDone} sesi lagi.`;
  const todayItems = recsOn(t).filter(r=>r.status==="plan").length + routineOn(t).length;
  const late = S.records.filter(r=>r.status==="plan" && r.date<t).length;
  let warn = "";
  if(todayItems) warn = `<div class="note warn">⏰ Hari ini ada ${todayItems} sesi yang belum selesai</div>`;
  else if(late) warn = `<div class="note warn">⚠️ ${late} sesi terjadwal sudah lewat dan belum ditandai selesai</div>`;

  const first = new Date(cur.y,cur.m,1), off=(first.getDay()+6)%7, nd=new Date(cur.y,cur.m+1,0).getDate();
  let cells = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(d=>`<div class="wd">${d}</div>`).join("");
  for(let i=0;i<off;i++) cells+=`<div class="day out"></div>`;
  for(let d=1; d<=nd; d++){
    const ds=`${mk}-${pad(d)}`;
    const dots=[];
    recsOn(ds).forEach(r=>dots.push(`<i class="dot ${r.status==="plan"?"plan":""}" style="--c:${ACTS[r.act].c}"></i>`));
    routineOn(ds).forEach(x=>dots.push(`<i class="dot rt" style="--c:${ACTS[x.act].c}"></i>`));
    const shown = dots.slice(0,4).join("") + (dots.length>4?`<span class="more">+${dots.length-4}</span>`:"");
    cells+=`<button class="day ${ds===sel?"sel":""} ${ds===t?"today":""} ${weightOn(ds)?"w":""}" data-day="${ds}" aria-label="${d} ${MONTHS[cur.m]}"><span class="n">${d}</span><span class="dots">${shown}</span></button>`;
  }
  const legend = Object.values(ACTS).map(a=>`<span><i style="background:${a.c}"></i>${a.name}</span>`).join("");

  return `${monthNav()}
  <div class="card">
    <div class="grid2">
      <div class="stat"><small>Sesi selesai</small><b class="good">${done}</b></div>
      <div class="stat"><small>Terjadwal</small><b class="accent">${plan}</b></div>
    </div>
    <div class="note info" style="margin-top:0">${info}</div>
    ${warn}
  </div>
  <div class="card">
    <div class="cal">${cells}</div>
    <div class="legend">${legend}</div>
    <div class="legend"><span>● selesai</span><span>○ terjadwal</span><span>◌ rutin mingguan</span><span><i style="background:var(--good);border-radius:2px;width:12px;height:4px"></i>BB tercatat</span></div>
  </div>
  ${dayCard()}
  ${routineCard()}`;
}

function recHtml(r){
  const a = ACTS[r.act];
  const val = r.metric!=="" && r.metric!=null ? `${fmt(r.metric)} ${a.metric.unit}` : "";
  const sub = [a.name, r.time, r.dur?`${r.dur} mnt`:""].filter(Boolean).join(" · ");
  return `<div class="item">
    <div class="ico" style="background:${a.c}22">${a.emoji}</div>
    <div class="meta"><b>${esc(r.type)}<span class="badge ${r.status}">${r.status==="done"?"Selesai":"Terjadwal"}</span></b><small>${esc(sub)}</small></div>
    <div class="val">${val}${r.extra?`<small>${esc(r.extra)}</small>`:""}</div>
    ${r.detail?`<div class="detail">${esc(r.detail)}</div>`:""}
    <div class="actions">
      ${r.status==="plan"?`<button class="btn sm ok" data-done="${r.id}">✓ Selesai</button>`:""}
      <button class="btn sm" data-edit="${r.id}">Edit</button>
      <button class="btn sm" data-del="${r.id}">Hapus</button>
    </div></div>`;
}
function rtHtml(x, ds){
  const a = ACTS[x.act];
  return `<div class="item">
    <div class="ico" style="background:${a.c}22">${a.emoji}</div>
    <div class="meta"><b>${esc(x.type)}<span class="badge rt">Rutin</span></b><small>${esc([a.name, x.time].filter(Boolean).join(" · "))}</small></div>
    <div></div>
    <div class="actions"><button class="btn sm ok" data-rdone="${ds}|${x.id}">✓ Selesai</button></div></div>`;
}
function dayCard(){
  const d = parse(sel), isT = sel===todayIso();
  const rs = recsOn(sel), rt = routineOn(sel), w = weightOn(sel);
  const body = (rs.length||rt.length) ? rs.map(recHtml).join("")+rt.map(x=>rtHtml(x,sel)).join("")
    : `<div class="empty"><big>🗓️</big>Belum ada jadwal di tanggal ini.</div>`;
  return `<div class="card">
    <h2>${DAYSF[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}</h2>
    <div class="sub">${isT?"Hari ini":sel<todayIso()?"Sudah lewat":"Akan datang"}${w?` · ⚖️ ${fmt1(w.kg)} kg`:""}</div>
    ${body}
    <div class="twin"><button class="btn" data-addday="1">➕ Tambah sesi</button><button class="btn" data-wday="1">⚖️ Catat BB</button></div>
  </div>`;
}
function routineCard(){
  const tw = new Date().getDay();
  const rows = WD_ORDER.map(wd=>{
    const items = (S.routine[wd]||[]).slice().sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
    const chips = items.map(x=>`<span class="rc" style="--c:${ACTS[x.act].c}" data-rdel="${wd}|${x.id}">${ACTS[x.act].emoji} ${esc(x.type)}${x.time?` · ${esc(x.time)}`:""} <u>×</u></span>`).join("");
    return `<div class="wk ${wd===tw?"td":""}"><b>${DAYS[wd]}</b><div class="chips">${chips}<span class="rc add" data-radd="${wd}">+ Tambah</span></div></div>`;
  }).join("");
  return `<div class="card"><h2>Jadwal mingguan</h2>
    <div class="hint" style="margin-bottom:6px">Latihan rutin tiap pekan. Otomatis muncul di kalender mulai hari ini ke depan.</div>${rows}</div>`;
}

/* ---------- Catat ---------- */
function newDraft(){
  const t=todayIso();
  return {act:(draft&&draft.act)||"gym", type:null, date:sel, time:"", dur:"", metric:"", extra:"", detail:"", status: sel>t?"plan":"done"};
}
function viewAdd(){
  if(!draft || draft._keep) draft = newDraft();
  const d = draft, a = ACTS[d.act];
  if(a.free){ if(d.type==null) d.type=""; } else if(!d.type || !a.types.includes(d.type)) d.type = a.types[0];
  const acts = Object.entries(ACTS).map(([k,v])=>`<button class="chip act ${k===d.act?"on":""}" style="--c:${v.c}" data-pact="${k}">${v.emoji} ${v.name}</button>`).join("");
  return `<div class="card" style="margin-top:16px">
    <h2>${d.id?"Edit sesi":"Catat sesi"}</h2>
    <label style="margin-top:10px">Aktivitas</label><div class="seg">${acts}</div>
    ${a.free
      ? `<label for="fType">Jenis ${a.name}</label><input class="field" id="fType" type="text" list="typeList" maxlength="60" autocomplete="off" placeholder="${esc(a.ph)}" value="${esc(d.type)}"><datalist id="typeList">${a.types.map(t=>`<option value="${esc(t)}">`).join("")}</datalist>`
      : `<label>Jenis ${a.name}</label><div class="seg" id="types">${a.types.map(t=>`<button class="chip ${t===d.type?"on":""}" data-type="${esc(t)}">${esc(t)}</button>`).join("")}</div>`}
    <label>Status</label>
    <div class="seg" id="status">
      <button class="chip ${d.status==="done"?"on":""}" data-st="done">Sudah selesai</button>
      <button class="chip ${d.status==="plan"?"on":""}" data-st="plan">Jadwalkan</button>
    </div>
    <div class="row2">
      <div><label for="fDate">Tanggal</label><input class="field" id="fDate" type="date" value="${d.date}"></div>
      <div><label for="fTime">Jam</label><input class="field" id="fTime" type="time" value="${esc(d.time)}"></div>
    </div>
    <div class="row2">
      <div><label for="fDur">Durasi (menit)</label><input class="field" id="fDur" type="number" inputmode="numeric" min="0" placeholder="mis. 60" value="${esc(d.dur)}"></div>
      <div><label for="fMet">${esc(a.metric.label)} (${a.metric.unit})</label><input class="field" id="fMet" type="number" inputmode="decimal" step="${a.metric.step}" min="0" placeholder="${a.metric.ph}" value="${esc(d.metric)}"></div>
    </div>
    <label for="fExtra">${esc(a.extra.label)}</label><input class="field" id="fExtra" type="text" placeholder="${esc(a.extra.ph)}" value="${esc(d.extra)}">
    <label for="fDetail">${esc(a.detail.label)}</label><textarea class="field" id="fDetail" rows="4" placeholder="${esc(a.detail.ph)}">${esc(d.detail)}</textarea>
    <div style="margin-top:18px"><button class="btn primary" id="saveBtn">${d.id?"Simpan perubahan":"Simpan"}</button></div>
    ${d.id?`<div style="margin-top:10px"><button class="btn" id="cancelEdit" style="width:100%;padding:13px">Batal</button></div>`:""}
  </div>`;
}
function syncDraft(){
  const g=id=>{const e=$("#"+id); return e?e.value:"";};
  Object.assign(draft,{date:g("fDate"),time:g("fTime"),dur:g("fDur"),metric:g("fMet"),extra:g("fExtra"),detail:g("fDetail")});
  const ft=$("#fType"); if(ft) draft.type=ft.value;
}
function bindAdd(){
  $("#view").onclick = e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.pact){ syncDraft(); draft.act=b.dataset.pact; draft.type=null; draft.metric=""; draft.extra=""; render(true); }
    else if(b.dataset.type){ syncDraft(); draft.type=b.dataset.type; render(true); }
    else if(b.dataset.st){ syncDraft(); draft.status=b.dataset.st; render(true); }
    else if(b.id==="saveBtn") saveDraft();
    else if(b.id==="cancelEdit"){ draft=null; S.tab="cal"; render(); }
  };
}
function saveDraft(){
  syncDraft();
  if(!draft.date){ toast("Isi tanggalnya dulu"); return; }
  if(ACTS[draft.act].free && !String(draft.type||"").trim()){ toast("Isi jenis latihannya dulu"); return; }
  const rec = {id:draft.id||uid(), act:draft.act, type:String(draft.type||"").trim(), date:draft.date, time:draft.time, dur:draft.dur, metric:draft.metric, extra:draft.extra.trim(), detail:draft.detail.trim(), status:draft.status};
  const i = S.records.findIndex(r=>r.id===rec.id);
  if(i>=0) S.records[i]=rec; else S.records.push(rec);
  const dt = parse(rec.date); cur={y:dt.getFullYear(), m:dt.getMonth()}; sel=rec.date;
  const lastAct = draft.act; draft={act:lastAct, _keep:true};
  S.tab="cal"; save(); render();
  toast(rec.status==="done" ? "Sesi tersimpan ✓" : "Sesi dijadwalkan ✓");
}

/* ---------- Berat badan ---------- */
function bmiCat(b){ return b<18.5?"Kurus":b<25?"Normal":b<30?"Berat berlebih":"Obesitas"; }
let cWeight = null;
function calcHtml(h, kg, sex){
  if(!(h>=100 && h<=230)) return `<div class="hint">Isi tinggi badan (100-230 cm) untuk melihat hasilnya.</div>`;
  const m=h/100, m2=m*m;
  const lo=18.5*m2, hi=24.9*m2, mid=22*m2;
  const rows=[["Kurus","< 18,5",`< ${fmt1(lo)} kg`],["Normal","18,5 - 24,9",`${fmt1(lo)} - ${fmt1(hi)} kg`],
    ["Berat berlebih","25 - 29,9",`${fmt1(25*m2)} - ${fmt1(29.9*m2)} kg`],["Obesitas","≥ 30",`≥ ${fmt1(30*m2)} kg`]];
  let head="", bmi=null, cat="";
  if(kg>=20 && kg<=400){
    bmi=kg/m2; cat=bmiCat(bmi);
    let msg;
    if(kg<lo) msg=`Berat Anda di bawah rentang sehat. Perlu naik sekitar ${fmt1(lo-kg)} kg untuk mencapai batas bawah (${fmt1(lo)} kg).`;
    else if(kg>hi) msg=`Berat Anda di atas rentang sehat. Perlu turun sekitar ${fmt1(kg-hi)} kg untuk mencapai batas atas (${fmt1(hi)} kg).`;
    else msg="Berat Anda sudah dalam rentang sehat. Pertahankan.";
    head=`<div class="grid2"><div class="stat"><small>BMI</small><b>${fmt1(bmi)}</b></div><div class="stat"><small>Kategori</small><b class="${cat==="Normal"?"good":"bad"}" style="font-size:18px;white-space:normal">${cat}</b></div></div><div class="note info" style="margin-top:0">${msg}</div>`;
  }
  const table=rows.map(r=>`<div class="crow ${cat===r[0]?"on":""}"><span>${r[0]}<br><small>BMI ${r[1]}</small></span><span style="text-align:right">${r[2]}</span></div>`).join("");
  let ideal=`<div class="rowb" style="margin-top:14px"><span>Rentang berat sehat</span><small>${fmt1(lo)} - ${fmt1(hi)} kg</small></div>
    <div class="rowb" style="margin-top:6px"><span>Berat ideal (BMI 22)</span><small>${fmt1(mid)} kg</small></div>`;
  if(sex){
    const broca=(h-100)*(sex==="p"?0.85:0.9);
    const inch=h/2.54-60;
    const dev=inch>=0 ? (sex==="p"?45.5:50)+2.3*inch : null;
    ideal+=`<div class="rowb" style="margin-top:6px"><span>Rumus Broca</span><small>${fmt1(broca)} kg</small></div>
    <div class="rowb" style="margin-top:6px"><span>Rumus Devine</span><small>${dev!=null?fmt1(dev)+" kg":"- (tinggi di bawah 152 cm)"}</small></div>`;
  } else ideal+=`<div class="hint" style="margin-top:8px">Pilih jenis kelamin untuk melihat rumus Broca dan Devine.</div>`;
  return `${head}<div class="catbox">${table}</div>${ideal}
    <div style="margin-top:14px"><button class="btn" style="width:100%" data-settgt="${Math.round(mid*10)/10}">🎯 Jadikan target (${fmt1(mid)} kg)</button></div>
    <div class="hint" style="margin-top:10px">Acuan WHO untuk dewasa. Hasilnya perkiraan kasar dan kurang pas untuk anak, ibu hamil, atau atlet berotot. Untuk target yang aman, konsultasikan dengan dokter atau ahli gizi.</div>`;
}
function chartSvg(list, target){
  const W=340,H=200,ml=40,mr=14,mt=14,mb=28;
  const ys=list.map(x=>+x.kg); if(target) ys.push(+target);
  let lo=Math.min(...ys), hi=Math.max(...ys); if(hi-lo<2){ const m=(hi+lo)/2; lo=m-1; hi=m+1; }
  const padY=(hi-lo)*0.12; lo-=padY; hi+=padY;
  const t0=parse(list[0].date).getTime(), t1=parse(list[list.length-1].date).getTime();
  const X=d=>ml+(t1===t0?(W-ml-mr)/2:(parse(d).getTime()-t0)/(t1-t0)*(W-ml-mr));
  const Y=v=>mt+(hi-v)/(hi-lo)*(H-mt-mb);
  let grid=""; for(let i=0;i<4;i++){ const v=lo+(hi-lo)*i/3, y=Y(v); grid+=`<line class="g-grid" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text class="g-txt" x="${ml-6}" y="${y+3}" text-anchor="end">${fmt1(v)}</text>`; }
  const pts=list.map(x=>`${X(x.date).toFixed(1)},${Y(x.kg).toFixed(1)}`);
  const line = list.length>1 ? `<polygon class="g-area" points="${X(list[0].date)},${H-mb} ${pts.join(" ")} ${X(list[list.length-1].date)},${H-mb}"/><polyline class="g-line" points="${pts.join(" ")}"/>` : "";
  const dots=list.map((x,i)=> i===list.length-1 ? "" : (list.length<=40?`<circle class="g-pt" cx="${X(x.date)}" cy="${Y(x.kg)}" r="3"/>`:"")).join("");
  const L=list[list.length-1], lx=X(L.date), ly=Y(L.kg);
  const tgt = target ? `<line class="g-tgt" x1="${ml}" x2="${W-mr}" y1="${Y(target)}" y2="${Y(target)}"/><text class="g-tgt-t" x="${W-mr}" y="${Y(target)-5}" text-anchor="end">Target ${fmt1(target)}</text>` : "";
  const lab=d=>{const x=parse(d); return `${x.getDate()} ${MON_S[x.getMonth()]}`;};
  const anchorLast = lx>W-60 ? "end" : "middle";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik berat badan">${grid}${tgt}${line}${dots}
    <circle class="g-last" cx="${lx}" cy="${ly}" r="5"/><text class="g-val" x="${lx}" y="${ly-10}" text-anchor="${anchorLast}">${fmt1(L.kg)}</text>
    <text class="g-txt" x="${X(list[0].date)}" y="${H-8}" text-anchor="start">${lab(list[0].date)}</text>
    ${list.length>1?`<text class="g-txt" x="${W-mr}" y="${H-8}" text-anchor="end">${lab(L.date)}</text>`:""}</svg>`;
}
function viewBB(){
  const all = weightsAsc(), g = S.goals;
  const tgt = g.targetKg!=="" ? +g.targetKg : null;
  const latest = all.length ? all[all.length-1] : null;
  const start = g.startKg!=="" ? +g.startKg : (all.length ? +all[0].kg : null);
  let ranged = all;
  if(wRange){ const from = new Date(); from.setDate(from.getDate()-wRange); ranged = all.filter(x=>parse(x.date)>=from); if(!ranged.length && latest) ranged=[latest]; }

  let stats = `<div class="empty"><big>⚖️</big>Belum ada data berat badan.<br>Catat berat pertama Anda di bawah.</div>`, chart="", insight="";
  if(latest){
    const diff = start!=null ? latest.kg - start : 0;
    stats = `<div class="grid2">
      <div class="stat"><small>Terakhir</small><b>${fmt1(latest.kg)} kg</b></div>
      <div class="stat"><small>Target</small><b>${tgt!=null?fmt1(tgt)+" kg":"-"}</b></div></div>
      <div class="grid2" style="margin-bottom:0">
      <div class="stat"><small>Dari awal (${start!=null?fmt1(start):"-"} kg)</small><b class="${diff<=0?"good":"bad"}">${diff>0?"+":""}${fmt1(diff)} kg</b></div>
      <div class="stat"><small>${g.height?"BMI":"Dicatat"}</small><b>${g.height?fmt1(latest.kg/Math.pow(g.height/100,2)):all.length+"x"}</b></div></div>`;
    if(g.height) stats += `<div class="hint" style="margin-top:8px">BMI ${bmiCat(latest.kg/Math.pow(g.height/100,2))} (acuan WHO, hanya perkiraan kasar).</div>`;
    chart = chartSvg(ranged, tgt);

    const from=new Date(); from.setDate(from.getDate()-28);
    const rec = all.filter(x=>parse(x.date)>=from);
    let perWeek=null;
    if(rec.length>=2){ const days=(parse(rec[rec.length-1].date)-parse(rec[0].date))/864e5; if(days>=7) perWeek=(rec[rec.length-1].kg-rec[0].kg)/(days/7); }
    let msg;
    if(tgt==null) msg = "Atur target berat badan di bawah untuk melihat progres dan perkiraan waktunya.";
    else {
      const rem = latest.kg - tgt, goingDown = start!=null ? start>tgt : rem>0;
      const reached = goingDown ? latest.kg<=tgt+0.05 : latest.kg>=tgt-0.05;
      if(reached) msg = "Target tercapai 🎉 Pertahankan, atau atur target baru.";
      else {
        msg = `Sisa ${fmt1(Math.abs(rem))} kg lagi untuk ${goingDown?"turun":"naik"} ke target.`;
        if(perWeek!=null){
          const toward = goingDown ? perWeek<0 : perWeek>0;
          msg += ` Tren 4 minggu: ${perWeek>0?"+":""}${fmt1(perWeek)} kg/minggu.`;
          if(toward && Math.abs(perWeek)>=0.05) msg += ` Dengan laju ini, sekitar ${Math.ceil(Math.abs(rem)/Math.abs(perWeek))} minggu lagi.`;
          else msg += " Belum bergerak ke arah target.";
        }
      }
    }
    let pct=null;
    if(tgt!=null && start!=null && start!==tgt) pct=Math.max(0,Math.min(100,(start-latest.kg)/(start-tgt)*100));
    insight = `${pct!=null?`<div style="margin:14px 0 4px"><div class="rowb"><span>Progres ke target</span><small>${Math.round(pct)}%</small></div><div class="prog"><i style="width:${pct}%"></i></div></div>`:""}
      <div class="note info" style="margin-top:8px">${msg}</div>`;
  }
  const hist = all.slice().reverse().slice(0,12).map((x,i,arr)=>{
    const prev = arr[i+1]; const dl = prev? x.kg-prev.kg : null; const d=parse(x.date);
    return `<div class="item" style="grid-template-columns:1fr auto auto;padding:10px 0">
      <div class="meta"><b style="font-size:16px">${fmt1(x.kg)} kg</b><small>${DAYS[d.getDay()]}, ${d.getDate()} ${MON_S[d.getMonth()]} ${d.getFullYear()}</small></div>
      <div class="val ${dl==null?"":(dl<=0?"good":"bad")}" style="color:${dl==null?"var(--muted)":""}">${dl==null?"":(dl>0?"+":"")+fmt1(dl)}</div>
      <button class="btn sm" data-wdel="${x.date}">Hapus</button></div>`;
  }).join("");
  const ex = weightOn(wDate);
  return `<div class="card" style="margin-top:16px"><h2>⚖️ Berat badan</h2>${stats}${insight}</div>
  <div class="card"><h2>Grafik</h2>
    <div class="seg" id="rng" style="margin:8px 0">${[[30,"30 hari"],[90,"90 hari"],[0,"Semua"]].map(([v,l])=>`<button class="chip ${wRange===v?"on":""}" data-rng="${v}">${l}</button>`).join("")}</div>
    ${chart||`<div class="empty">Grafik muncul setelah ada data.</div>`}
  </div>
  <div class="card"><h2>Kalkulator berat ideal</h2>
    <div class="hint">Hitung BMI, kategori, dan rentang berat sehat sesuai tinggi badan.</div>
    <div class="row2">
      <div><label for="cH">Tinggi (cm)</label><input class="field" id="cH" type="number" inputmode="numeric" min="100" max="230" placeholder="mis. 170" value="${g.height}"></div>
      <div><label for="cW">Berat (kg)</label><input class="field" id="cW" type="number" inputmode="decimal" step="0.1" min="20" placeholder="mis. 70" value="${cWeight!=null?cWeight:(latest?latest.kg:"")}"></div>
    </div>
    <label>Jenis kelamin</label>
    <div class="seg" id="cSex"><button class="chip ${g.sex==="l"?"on":""}" data-sex="l">Laki-laki</button><button class="chip ${g.sex==="p"?"on":""}" data-sex="p">Perempuan</button></div>
    <div id="calcOut" style="margin-top:14px">${calcHtml(+g.height, cWeight!=null?+cWeight:(latest?+latest.kg:NaN), g.sex)}</div>
  </div>
  <div class="card"><h2>Catat berat</h2>
    <div class="row2">
      <div><label for="wD">Tanggal</label><input class="field" id="wD" type="date" value="${wDate}"></div>
      <div><label for="wK">Berat (kg)</label><input class="field" id="wK" type="number" inputmode="decimal" step="0.1" min="20" max="400" placeholder="mis. 72.4" value="${ex?ex.kg:""}"></div>
    </div>
    <div style="margin-top:16px"><button class="btn primary" id="wSave">Simpan berat</button></div>
  </div>
  <div class="card"><h2>Target berat badan</h2>
    <div class="row2">
      <div><label for="gT">Target (kg)</label><input class="field" id="gT" type="number" inputmode="decimal" step="0.1" min="20" placeholder="mis. 65" value="${g.targetKg}"></div>
      <div><label for="gS">Berat awal (kg)</label><input class="field" id="gS" type="number" inputmode="decimal" step="0.1" min="20" placeholder="otomatis" value="${g.startKg}"></div>
    </div>
    <div class="hint" style="margin-top:8px">Berat awal dikosongkan = pakai catatan pertama.</div>
    <div style="margin-top:16px"><button class="btn primary" id="gSave">Simpan target</button></div>
  </div>
  <div class="card"><h2>Riwayat</h2>${hist||`<div class="empty">Belum ada riwayat.</div>`}</div>`;
}

function viewReport(){
  const mk=monthKey(), recs=S.records.filter(r=>r.date.startsWith(mk)&&r.status==="done");
  const mins=recs.reduce((s,r)=>s+(+r.dur||0),0);

  const days=new Set(S.records.filter(r=>r.status==="done").map(r=>r.date));
  let streak=0, dd=new Date(); if(!days.has(iso(dd))) dd.setDate(dd.getDate()-1);
  while(days.has(iso(dd))){ streak++; dd.setDate(dd.getDate()-1); }
  const activeDays=new Set(recs.map(r=>r.date)).size;
  const by=Object.keys(ACTS).map(k=>{ const rr=recs.filter(r=>r.act===k); return {k, n:rr.length, m:rr.reduce((s,r)=>s+(+r.dur||0),0), met:rr.reduce((s,r)=>s+(+r.metric||0),0)}; }).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const tot=recs.length||1;
  const byHtml=by.map(x=>{ const a=ACTS[x.k]; return `<div style="margin:14px 0"><div class="rowb"><span>${a.emoji} ${a.name}</span><small>${x.n} sesi · ${fmt(x.m)} mnt${x.met?` · ${fmt(x.met)} ${a.metric.unit}`:""}</small></div>
    <div class="prog"><i style="width:${x.n/tot*100}%;background:${a.c}"></i></div></div>`; }).join("");
  const ws=weekStart(new Date()), we=new Date(ws); we.setDate(we.getDate()+7);
  const wkDone=S.records.filter(r=>r.status==="done"&&parse(r.date)>=ws&&parse(r.date)<we).length;
  const gw=+S.goals.week||1, gm=+S.goals.minutes||0;

  </div>
  <div class="card"><h2>Sesi per minggu</h2>

  <div class="card"><h2>Per aktivitas</h2>${byHtml||`<div class="empty">Belum ada data.</div>`}</div>
  <div class="card"><h2>Target latihan</h2>
    <div style="margin:12px 0"><div class="rowb"><span>Sesi minggu ini</span><small>${wkDone} / ${gw}</small></div><div class="prog"><i style="width:${p1}%"></i></div></div>
    <div style="margin:12px 0"><div class="rowb"><span>Durasi bulan ini</span><small>${fmt(mins)} / ${fmt(gm)} mnt</small></div><div class="prog"><i style="width:${p2}%"></i></div></div>
    <div class="row2"><div><label for="gW">Sesi per minggu</label><input class="field" id="gW" type="number" inputmode="numeric" min="1" max="21" value="${S.goals.week}"></div>
    <div><label for="gM">Menit per bulan</label><input class="field" id="gM" type="number" inputmode="numeric" min="0" step="10" value="${S.goals.minutes}"></div></div>
    <div style="margin-top:16px"><button class="btn primary" id="tSave">Simpan target</button></div>
  </div>

    <p class="hint">Data tersimpan di HP ini saja. Ekspor berkala agar aman kalau data browser terhapus.</p>

function importData(f){

  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d||!Array.isArray(d.records)) throw 0; S=norm(d); save(); render(); toast("Data diimpor ✓"); }catch(e){ toast("File tidak valid"); } };
  rd.readAsText(f);
}

function shiftDay(d,n){ const x=parse(d); x.setDate(x.getDate()+n); return iso(x); }
function fmtDur(m){ m=+m||0; if(!m) return ""; const h=Math.floor(m/60), r=m%60; return h?`${h}j${r?" "+r+"m":""}`:`${r}m`; }
function endTime(t,m){ if(!t||!(+m)) return ""; const [h,mi]=t.split(":").map(Number); const x=(h*60+mi+ +m)%1440; return `${pad(Math.floor(x/60))}:${pad(x%60)}`; }

function viewAgenda(){
  const t=todayIso(), all=agOn(agDate), total=all.length, done=all.filter(a=>a.done).length;
  const list = agFilter==="all" ? all : all.filter(a=>(a.cat||"lainnya")===agFilter);
  const pct = total ? Math.round(done/total*100) : 0, d=parse(agDate);
  const mins = all.reduce((s,a)=>s+(+a.dur||0),0);
  const ed = agEdit ? (S.agenda||[]).find(a=>a.id===agEdit) : null;
  const f = ed ? {title:ed.title,time:ed.time||"",dur:ed.dur||"",loc:ed.loc||"",prio:String(ed.prio||0),note:ed.note||"",rep:"0",cnt:"4"} : agForm;
  const late = (S.agenda||[]).filter(a=>!a.done && a.date<t).length;
  const sports = recsOn(agDate).map(r=>`${ACTS[r.act].emoji} ${esc(r.type)}${r.time?" "+esc(r.time):""}${r.status==="plan"?" (rencana)":""}`)
    .concat(routineOn(agDate).map(x=>`${ACTS[x.act].emoji} ${esc(x.type)}${x.time?" "+esc(x.time):""} (jadwal rutin)`));
  const items = list.map(a=>{
    const k=catOf(a.cat), en=endTime(a.time,a.dur);
    const meta=[a.time?`🕐 ${esc(a.time)}${en?"–"+en:""}`:"", a.dur?`⏱️ ${fmtDur(a.dur)}`:"", a.loc?`📍 ${esc(a.loc)}`:""].filter(Boolean).join(" · ") || "Tanpa jam";
    return `<div class="item ${a.done?"ag-done":""}">
      <button class="ico ag-chk ${a.done?"on":""}" data-ag="toggle" data-id="${a.id}" aria-label="Tandai selesai">${a.done?"✓":k.e}</button>
      <div class="meta"><b>${esc(a.title)}${a.prio===2?`<span class="ag-tag" style="background:var(--bad);color:#fff">Mendesak</span>`:a.prio===1?`<span class="badge plan">Penting</span>`:""}</b>
        <span class="ag-meta"><span class="ag-tag" style="margin:0 6px 0 0;background:${k.c}22;color:${k.c}">${k.n}</span>${meta}</span></div>
      <div></div>
      ${a.note?`<div class="detail">${esc(a.note)}</div>`:""}
      <div class="actions"><button class="btn sm" data-ag="edit" data-id="${a.id}">✏️ Ubah</button><button class="btn sm" data-ag="del" data-id="${a.id}">🗑️ Hapus</button></div>
    </div>`; }).join("");
  const filt = `<div class="ag-scroll"><button class="chip ${agFilter==="all"?"on":""}" data-ag="filter" data-k="all">Semua</button>${
    Object.entries(AG_CATS).map(([k,v])=>`<button class="chip ${agFilter===k?"on":""}" data-ag="filter" data-k="${k}">${v.e} ${v.n}</button>`).join("")}</div>`;
  return `<div class="card" style="margin-top:14px">${agCalHtml()}</div>
    <div class="card">
      <div class="rowb"><span><b>${DAYSF[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}</b>${agDate===t?" · Hari ini":""}</span>
        <button class="btn sm" data-ag="today">Ke hari ini</button></div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="ag-sum"><div class="stat"><small>Agenda</small><b>${total}</b></div><div class="stat"><small>Selesai</small><b class="good">${done}</b></div><div class="stat"><small>Total waktu</small><b>${fmtDur(mins)||"-"}</b></div></div>
      ${sports.length?`<div class="note info">🏃 Olahraga hari ini: ${sports.join(", ")}</div>`:""}
      ${late?`<div class="note warn">⚠️ ${late} agenda hari sebelumnya belum selesai</div>`:""}
    </div>
    <div class="card">
      <h2>${ed?"Ubah agenda":"Tambah agenda"}</h2>
      <div class="ag-add">
        <input class="field" id="agT" type="text" maxlength="120" autocomplete="off" placeholder="Nama kegiatan, mis. Meeting tim" value="${esc(f.title)}">
        <span class="ag-lbl">Jenis kegiatan</span>
        <div class="ag-scroll" id="agCats">${Object.entries(AG_CATS).map(([k,v])=>`<button class="chip act ${k===agCat?"on":""}" style="--c:${v.c}" data-ag="cat" data-k="${k}">${v.e} ${v.n}</button>`).join("")}</div>
        <div class="row2"><div><span class="ag-lbl">Jam mulai</span><input class="field" id="agH" type="time" value="${esc(f.time)}"></div>
          <div><span class="ag-lbl">Durasi (menit)</span><input class="field" id="agD" type="number" inputmode="numeric" min="0" max="1440" placeholder="mis. 60" value="${esc(f.dur)}"></div></div>
        <div class="ag-scroll">${AG_DURS.map(m=>`<button class="chip" data-ag="dur" data-v="${m}">${fmtDur(m)}</button>`).join("")}</div>
        <div class="row2"><div><span class="ag-lbl">Lokasi</span><input class="field" id="agL" type="text" maxlength="80" autocomplete="off" placeholder="mis. Kantor" value="${esc(f.loc)}"></div>
          <div><span class="ag-lbl">Prioritas</span><select class="field" id="agP">${AG_PRIO.map((p,i)=>`<option value="${i}" ${f.prio===String(i)?"selected":""}>${p}</option>`).join("")}</select></div></div>
        <span class="ag-lbl">Catatan</span>
        <input class="field" id="agN" type="text" maxlength="200" autocomplete="off" placeholder="Catatan (opsional)" value="${esc(f.note)}">
        <div class="row2 ${ed?"hide":""}"><div><span class="ag-lbl">Ulangi</span><select class="field" id="agR"><option value="0" ${f.rep==="0"?"selected":""}>Tidak diulang</option><option value="1" ${f.rep==="1"?"selected":""}>Setiap hari</option><option value="7" ${f.rep==="7"?"selected":""}>Setiap minggu</option></select></div>
          <div><span class="ag-lbl">Berapa kali</span><input class="field" id="agC" type="number" inputmode="numeric" min="2" max="60" value="${esc(f.cnt)}"></div></div>
        <button class="btn primary" id="agSave">${ed?"Simpan perubahan":"➕ Tambah agenda"}</button>
        ${ed?`<button class="btn" data-ag="cancel">Batal ubah</button>`:""}
      </div>
    </div>
    <div class="card">
      <h2>Daftar agenda</h2>
      ${filt}
      ${items || `<div class="empty"><big>🗒️</big>${total?"Tidak ada agenda di jenis ini.":"Belum ada agenda.<br>Tambahkan di atas."}</div>`}
      ${(total-done>0 || done>0)?`<div class="twin">
        ${total-done>0?`<button class="btn" data-ag="move">➡️ Pindah sisa ke besok</button>`:"<span></span>"}
        ${done>0?`<button class="btn" data-ag="clear">🧹 Hapus yang selesai</button>`:"<span></span>"}</div>`:""}
    </div>
    <button class="btn" style="width:100%" data-ag="back">← Kembali ke Kalender</button>`;
}
function bindAgenda(){
  $("#agSave").onclick = agSave;
  ["agT","agH","agD","agL","agN"].forEach(i=>{ const el=$("#"+i); if(el) el.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); agSave(); } }; });
}
function agSave(){
  const title=$("#agT").value.trim();
  if(!title){ toast("Isi nama kegiatan dulu"); return; }
  const v={title, cat:agCat, time:$("#agH").value, dur:Math.max(0,Math.min(1440,parseInt($("#agD").value)||0)),
    loc:$("#agL").value.trim(), prio:+$("#agP").value||0, note:$("#agN").value.trim()};
  S.agenda = S.agenda||[];
  if(agEdit){ const a=S.agenda.find(x=>x.id===agEdit); if(a) Object.assign(a,v); agEdit=null; toast("Agenda diperbarui ✓"); }
  else {
    const step=+$("#agR").value||0, n=step ? Math.max(2,Math.min(60,parseInt($("#agC").value)||2)) : 1;
    for(let i=0;i<n;i++) S.agenda.push({id:uid(), date:shiftDay(agDate,i*step), done:false, ...v});
    toast(n>1 ? `${n} agenda ditambahkan ✓` : "Agenda ditambahkan ✓");
    agForm = {title:"",time:"",dur:"",loc:"",prio:"0",note:"",rep:"0",cnt:"4"};
  }
  save(); render(true);
}
$("#agBtn").onclick = ()=>{
  if(S.tab==="agenda"){ agEdit=null; S.tab="cal"; render(); return; }
  if(draft && !draft.id) draft=null;
  agDate=todayIso(); agCur={y:new Date().getFullYear(), m:new Date().getMonth()}; agEdit=null; S.tab="agenda"; render();
};
function agGoDay(ds){ agDate=ds; const x=parse(ds); agCur={y:x.getFullYear(), m:x.getMonth()}; agEdit=null; }
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-ag]"); if(!t) return;
  const D=t.dataset, id=D.id; S.agenda=S.agenda||[];
  if(D.ag==="cat"){ agCat=D.k; document.querySelectorAll("#agCats .chip").forEach(b=>b.classList.toggle("on", b.dataset.k===agCat)); return; }
  if(D.ag==="dur"){ const el=$("#agD"); if(el) el.value=D.v; return; }
  agSync();
  if(D.ag==="mnav"){ agCur.m+=+D.n; if(agCur.m<0){agCur.m=11;agCur.y--;} if(agCur.m>11){agCur.m=0;agCur.y++;} render(true); }
  else if(D.ag==="day"){ agGoDay(D.d); render(true); }
  else if(D.ag==="today"){ agGoDay(todayIso()); render(true); }
  else if(D.ag==="filter"){ agFilter=D.k; render(true); }
  else if(D.ag==="toggle"){ const a=S.agenda.find(x=>x.id===id); if(a){ a.done=!a.done; save(); render(true); } }
  else if(D.ag==="edit"){ const a=S.agenda.find(x=>x.id===id); if(a){ agEdit=id; agCat=a.cat||"lainnya"; render(); } }
  else if(D.ag==="cancel"){ agEdit=null; render(true); }
  else if(D.ag==="del"){ const a=S.agenda.find(x=>x.id===id); if(!a) return;
    confirmBox("Hapus agenda ini?", `${esc(a.title)} · ${a.date}. Tindakan ini tidak bisa dibatalkan.`,
      ()=>{ S.agenda=S.agenda.filter(x=>x.id!==id); if(agEdit===id) agEdit=null; save(); render(true); toast("Agenda dihapus"); }); }
  else if(D.ag==="move"){ const nx=shiftDay(agDate,1); let n=0;
    S.agenda.forEach(a=>{ if(a.date===agDate && !a.done){ a.date=nx; n++; } });
    if(n){ save(); render(true); toast(`${n} agenda dipindah ke besok ✓`); } }
  else if(D.ag==="clear"){ const n=S.agenda.filter(a=>a.date===agDate && a.done).length; if(!n) return;
    confirmBox("Hapus agenda selesai?", `${n} agenda yang sudah selesai di tanggal ini akan dihapus.`,
      ()=>{ S.agenda=S.agenda.filter(a=>!(a.date===agDate && a.done)); save(); render(true); toast("Agenda selesai dihapus"); }); }
  else if(D.ag==="back"){ S.tab="cal"; render(); }
});

/* ================= Tombol pasang aplikasi ================= */
let deferredInstall = null;
const isStandalone = ()=> (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true;
const isIOS = ()=> /iphone|ipad|ipod/i.test(navigator.userAgent);
function installedFlag(v){ try{ if(v===undefined) return localStorage.getItem("mr-installed")==="1"; if(v) localStorage.setItem("mr-installed","1"); else localStorage.removeItem("mr-installed"); }catch(e){} return false; }
function updInstall(){ $("#installBar").classList.toggle("hide", isStandalone() || installedFlag()); }
function markInstalled(){ deferredInstall=null; installedFlag(true); updInstall(); }
addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredInstall=e; installedFlag(false); updInstall(); });
addEventListener("appinstalled", ()=>{ markInstalled(); toast("Aplikasi terpasang ✓"); });
$("#installBtn").onclick = async ()=>{
  if(deferredInstall){
    const p=deferredInstall; deferredInstall=null;
    try{ p.prompt(); const r=await p.userChoice; if(r && r.outcome==="accepted"){ markInstalled(); toast("Aplikasi terpasang ✓"); } }catch(e){}
    return;
  }
  const steps = isIOS()
    ? `<li>Buka alamat ini di <b>Safari</b></li><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah)</li><li>Pilih <b>Tambah ke Layar Utama</b></li>`
    : `<li>Buka alamat ini di <b>Chrome</b></li><li>Ketuk menu <b>⋮</b> di pojok kanan atas</li><li>Pilih <b>Instal aplikasi</b> (atau <b>Tambahkan ke layar utama</b>)</li>`;
  openSheet(`<h3>Pasang Mr. Activity</h3><ol style="padding-left:20px;line-height:1.9;font-weight:600">${steps}</ol>
    <div class="hint">Setelah terpasang, tombol ini hilang otomatis.</div>
    <div class="btns"><button class="btn ok" id="instOk">Mengerti</button></div>`);
  $("#sheet").onclick = e=>{ if(e.target.id==="instOk") closeSheet(); };
};
updInstall();

render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
